<!doctype html>
<!--
  micro-success-morph: a submit button narrows into a circle while it works (a ring turns
  inside it), then a tick draws itself in it when done; after two seconds it opens back
  into the button with a "Sent" label. About 400ms for each morph.
  Mechanism: the button's width is never animated; the button closes in with clip-path
  (inset with full rounding) and the label fades, so nothing reflows. The tick is
  an SVG path with pathLength="1" and a stroke-dashoffset transition. The result is
  announced through aria-live and the button is aria-disabled while busy.
  Keyboard: Enter or Space. Reduced motion: no morph, the label changes to "Sending",
  then "Sent".
  Copy the blocks marked for copying (CSS, HTML and script).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Success morph to a tick (micro-success-morph)</title>
<style>
/* Demo page */
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e9efe9; color: #14211a; font: 400 16px/1.5 "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
.card { width: min(26rem, 92vw); background: #fff; border-radius: 12px; padding: 1.75rem; display: grid; gap: 1rem; }
.card h1 { font: 600 1.3rem/1.2 "Avenir Next", sans-serif; margin: 0; }
.card p { margin: 0; color: #56645b; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* argus:copy-start css */
:root { --ease-out: cubic-bezier(.22,1,.36,1); --ease-in-out: cubic-bezier(.65,0,.35,1); --t-base: 320ms; }
.morph { all: unset; box-sizing: border-box; position: relative; display: grid; place-items: center; height: 52px; width: 100%; cursor: pointer;
  font: 600 15px/1 "Avenir Next", sans-serif; color: #fff; background: #1f6b45; border-radius: 6px;
  /* the button itself closes in with clip-path, so its width (and the layout) never changes */
  clip-path: inset(0 0 0 0 round 6px); transition: clip-path 400ms var(--ease-in-out), background-color var(--t-base); }
.morph:focus-visible { outline: 2px solid #fff; outline-offset: -5px; } /* inset ring: clip-path would hide an outer one */
.morph .label { transition: opacity 150ms 260ms; } /* on the way back, wait for the pill to open before the label shows */
.morph.is-busy .label, .morph.is-done .label { transition-delay: 0s; }
.morph svg { position: absolute; width: 28px; height: 28px; opacity: 0; transition: opacity 150ms; }
.morph .ring { fill: none; stroke: #ffffff80; stroke-width: 3; stroke-dasharray: .25 1; transform-origin: 50% 50%; }
.morph .tick { fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 360ms var(--ease-out) 120ms; }
.morph.is-busy, .morph.is-done { clip-path: inset(0 calc(50% - 26px) 0 calc(50% - 26px) round 26px); }
.morph.is-busy .label, .morph.is-done .label { opacity: 0; }
.morph.is-busy svg, .morph.is-done svg { opacity: 1; }
.morph.is-busy .ring { animation: morph-spin .8s linear infinite; }
.morph.is-done .ring { opacity: 0; }
.morph.is-done .tick { stroke-dashoffset: 0; }
.morph.is-done { background: #14211a; }
@keyframes morph-spin { to { rotate: 1turn; } }
@media (prefers-reduced-motion: reduce) {
  .morph { transition: none; clip-path: inset(0 round 6px) !important; }
  .morph .label { opacity: 1 !important; }
  .morph svg { display: none; }
}
/* argus:copy-end css */
</style>
</head>
<body>
<main class="card">
  <h1>Send the quote to Harbour Joinery</h1>
  <p>£4,280 for the kitchen units, valid for 30 days.</p>
  <!-- argus:copy-start html -->
  <button class="morph" type="button"><span class="label">Send quote</span>
    <svg viewBox="0 0 28 28" aria-hidden="true"><circle class="ring" cx="14" cy="14" r="11" pathLength="1"/><path class="tick" pathLength="1" d="M8 14.5l4 4 8-9"/></svg>
  </button>
  <span class="sr" aria-live="polite"></span>
  <!-- argus:copy-end html -->
</main>
<script>
// argus:copy-start js
(() => {
  document.querySelectorAll('.morph').forEach(btn => {
    const label = btn.querySelector('.label');
    const live = btn.nextElementSibling;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    btn.addEventListener('click', async () => {
      if (btn.getAttribute('aria-disabled') === 'true') return;
      btn.setAttribute('aria-disabled', 'true');
      btn.classList.add('is-busy');
      if (reduce.matches) label.textContent = 'Sending';
      await new Promise(r => setTimeout(r, 900));          // stand-in for the real request
      btn.classList.replace('is-busy', 'is-done');
      live.textContent = 'Quote sent.';
      if (reduce.matches) label.textContent = 'Sent';
      setTimeout(() => {
        btn.classList.remove('is-done');
        label.textContent = 'Sent, send again?';
        btn.removeAttribute('aria-disabled');
      }, 2000);
    });
  });
})();
// argus:copy-end js
if (location.search.includes('demo')) setTimeout(() => document.querySelector('.morph').click(), 250);
</script>
</body>
</html>
