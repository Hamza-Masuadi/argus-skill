<!doctype html>
<!--
  shader-background: a hero ground drawn by one small fragment shader: contour lines of a slowly
  shifting seabed, for a marine survey company. Tied to the subject on purpose; a generic drifting
  colour blob is the look to avoid. Swap the field function for the subject's own pattern (weave,
  grain of paper, rings of a tree), keep the plumbing.

  Level: moment or showpiece.

  Library (pinned, vendored, runs offline): OGL 1.0.11 (Unlicense), vendor/ogl-1.0.11.global.js.
  CDN alternative as an ES module: https://cdn.jsdelivr.net/npm/ogl@1.0.11/+esm

  Cheap by construction:
    - one full-screen triangle, one draw, DPR 1, rendered at most 30 times a second
    - paused when the hero is off screen (IntersectionObserver) and when the tab is hidden
    - reduced motion: one frame is drawn and the loop never starts
  Fallbacks:
    CSS first: the hero has a quiet CSS ground of its own (repeating rings) that shows until the
    canvas has drawn a frame, and stays if WebGL is missing, fails, or the context is lost.
    No script: the CSS ground. Text sits on a solid panel colour either way, so contrast never
    depends on the shader.
  Registers window.__argus.timelines.field (progress 0-1 moves the field through 60 seconds of its
  drift; shot.js --timeline field shows it frame by frame).
  Copy the marked blocks (the copy markers below).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subject-tied shader background (shader-background)</title>
<style>
/* Demo page */
* { box-sizing: border-box; }
body { margin: 0; background: #0d2230; color: #e6f0ee; font: 400 17px/1.6 "Avenir Next", "Segoe UI", system-ui, sans-serif; }
a { color: inherit; }
:focus-visible { outline: 2px solid #9fe3cf; outline-offset: 3px; }
.top { position: relative; z-index: 2; display: flex; justify-content: space-between; padding: 1.4rem clamp(1.25rem, 4vw, 3rem); font-size: 14px; }
.hero h1 { font: 500 clamp(2.75rem, 7vw, 6.5rem)/.95 "Avenir Next", system-ui, sans-serif; letter-spacing: -.035em; margin: 0 0 1.25rem; max-width: 13ch; }
.hero p { max-width: 30rem; margin: 0 0 1.75rem; color: #b9cdca; }
.hero .cta { display: inline-block; padding: .85rem 1.3rem; background: #9fe3cf; color: #0d2230; font-weight: 600; text-decoration: none; border-radius: 2px; }
.next { padding: 14vh clamp(1.25rem, 4vw, 3rem); max-width: 46rem; }

/* argus:copy-start shader-background css */
.sb-hero { position: relative; min-height: 92vh; display: grid; align-content: end; padding: 0 clamp(1.25rem, 4vw, 3rem) 10vh; overflow: hidden; isolation: isolate;
  /* The CSS ground: shown until the shader draws, and whenever it cannot. */
  background: repeating-radial-gradient(circle at 70% 40%, #0d2230 0 22px, #12304022 22px 23px, #0d2230 23px 46px), #0d2230; }
.sb-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; opacity: 0; transition: opacity 600ms cubic-bezier(.16, 1, .3, 1); }
.sb-canvas.sb-drawn { opacity: 1; }
.sb-panel { background: #0d2230e6; padding: clamp(1.25rem, 3vw, 2rem); max-width: 40rem; border-radius: 2px; } /* text never sits on the moving lines */
/* argus:copy-end shader-background css */
</style>
</head>
<body>
<header class="top"><strong>Deepwater Survey Co.</strong><a href="#work">Our surveys</a></header>
<main>
  <!-- argus:copy-start shader-background html -->
  <section class="sb-hero hero">
    <canvas class="sb-canvas" aria-hidden="true"></canvas>
    <div class="sb-panel">
      <h1>We map the floor of the North Sea.</h1>
      <p>Bathymetric surveys for wind farms, cables and harbours, to 0.1&nbsp;m vertical accuracy.</p>
      <a class="cta" href="#work">See a sample survey</a>
    </div>
  </section>
  <!-- argus:copy-end shader-background html -->
  <section class="next" id="work"><h2>Surveys since 2009</h2><p>Over 4,000&nbsp;km&sup2; charted for 60 clients.</p></section>
</main>

<!-- argus:copy-start shader-background js -->
<script src="vendor/ogl-1.0.11.global.js" defer></script>
<script>
addEventListener('DOMContentLoaded', () => {
  const reg = (window.__argus = window.__argus || { timelines: {}, scenes: [] });
  const canvas = document.querySelector('.sb-canvas');
  const hero = canvas.parentElement;
  if (!window.OGL) return; // the CSS ground stays
  const { Renderer, Program, Mesh, Triangle } = OGL;
  let renderer;
  try { renderer = new Renderer({ canvas, dpr: 1, alpha: false, antialias: false }); } catch (e) { return; }
  const gl = renderer.gl;
  if (!gl) return;
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); canvas.classList.remove('sb-drawn'); stop(); });

  const program = new Program(gl, {
    vertex: `attribute vec2 position; attribute vec2 uv; varying vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position, 0.0, 1.0); }`,
    fragment: `precision mediump float;
      uniform float uTime; uniform vec2 uRes; varying vec2 vUv;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
      }
      float depth(vec2 p) { // the seabed: three octaves, drifting very slowly
        float t = uTime * 0.02;
        return noise(p + t) * 0.55 + noise(p * 2.1 - t) * 0.3 + noise(p * 4.3 + t * 0.5) * 0.15;
      }
      void main() {
        vec2 p = vUv * vec2(uRes.x / uRes.y, 1.0) * 2.2;
        float d = depth(p);
        float lines = d * 14.0;
        float f = abs(fract(lines + 0.5) - 0.5); // distance to the nearest contour
        float contour = 1.0 - smoothstep(0.03, 0.07, f);
        float index = 1.0 - smoothstep(0.03, 0.07, abs(fract(lines / 5.0 + 0.5) - 0.5) * 5.0); // every fifth line brighter
        vec3 ground = mix(vec3(0.051, 0.133, 0.188), vec3(0.075, 0.2, 0.26), d);
        vec3 col = mix(ground, vec3(0.62, 0.89, 0.81), contour * 0.22 + index * 0.25);
        gl_FragColor = vec4(col, 1.0);
      }`,
    uniforms: { uTime: { value: 0 }, uRes: { value: [1, 1] } },
  });
  const mesh = new Mesh(gl, { geometry: new Triangle(gl), program });

  const size = () => { const r = hero.getBoundingClientRect(); renderer.setSize(r.width, r.height); program.uniforms.uRes.value = [r.width, r.height]; };
  let t0 = performance.now(), offset = 0, raf = 0, last = 0, visible = true, held = false;
  const draw = () => { renderer.render({ scene: mesh }); if (!canvas.classList.contains('sb-drawn')) canvas.classList.add('sb-drawn'); };
  const loop = (now) => {
    raf = requestAnimationFrame(loop);
    if (now - last < 33) return; // 30 fps is plenty for a slow drift
    last = now;
    program.uniforms.uTime.value = offset + (now - t0) / 1000;
    draw();
  };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const start = () => { if (!raf && !reduced && !held && visible && !document.hidden) { t0 = performance.now(); raf = requestAnimationFrame(loop); } };
  function stop() { if (raf) { offset = program.uniforms.uTime.value; cancelAnimationFrame(raf); raf = 0; } }

  new IntersectionObserver(([e]) => { visible = e.isIntersecting; visible ? start() : stop(); }).observe(hero);
  document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));
  addEventListener('resize', () => { size(); draw(); });
  size();
  draw(); // one frame always: the reduced-motion version is this frame, still
  start();

  // For shot.js --timeline field: progress 0-1 = 0-60s of drift, drawn at once.
  reg.timelines.field = {
    progress(p) { if (p === undefined) return (program.uniforms.uTime.value % 60) / 60; program.uniforms.uTime.value = p * 60; draw(); return this; },
    pause() { held = true; stop(); return this; },
    paused(v) { if (v === undefined) return held; held = v; if (!v) start(); return this; },
  };
});
</script>
<!-- argus:copy-end shader-background js -->
</body>
</html>
