<!doctype html>
<!--
  arrival-headline-wipe: on first paint the headline's lines rise out of their masks one
  after another while the picture beside them wipes open from the bottom and settles from
  1.1 to 1; the small details follow last. About 1.1s in all, once per page load.
  Mechanism: CSS only. A class on <html> (set by a one-line inline script before paint)
  arms the start state; @keyframes run on load. Nothing waits on JS, fonts or images
  after that, and without JS everything is simply visible.
  Touch and keyboard: the same. Reduced motion: no travel or wipe; a 1ms fade.
  Copy the blocks marked for copying (CSS, HTML and script).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headline lines with a picture wipe (arrival-headline-wipe)</title>
<!-- argus:copy-start html -->
<script>document.documentElement.classList.add('arrive');</script>
<!-- argus:copy-end html -->
<style>
/* Demo page */
* { box-sizing: border-box; }
body { margin: 0; background: #ece7df; color: #1e1b18; font: 400 17px/1.6 "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
.top { display: flex; justify-content: space-between; padding: 1.5rem clamp(1.25rem, 4vw, 3rem); font-size: 14px; position: relative; z-index: 1; }
.hero { min-height: calc(100vh - 70px); display: grid; grid-template-columns: 7fr 5fr; align-items: end; gap: 2rem; padding: 0 clamp(1.25rem, 4vw, 3rem) 6vh; }
.hero h1 { font: 400 clamp(3rem, 8.5vw, 8.5rem)/.92 "Didot", "Bodoni 72", "Iowan Old Style", serif; letter-spacing: -.03em; margin: 0 0 2rem; }
.hero .meta { display: flex; gap: 2.5rem; font-size: 14px; }
.hero .meta a { color: inherit; font-weight: 600; display: inline-block; padding: .7rem 0; margin: -.7rem 0; }
.hero figure { margin: 0; height: 78vh; border-radius: 2px; overflow: hidden; }
.hero figure svg { width: 100%; height: 100%; display: block; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .hero figure { height: 50vh; order: -1; } }

/* argus:copy-start css */
:root { --ease-out: cubic-bezier(.22,1,.36,1); --t-slow: 640ms; --t-page: 900ms; --stagger-line: 70ms; }
.arr-line { display: block; overflow: clip; overflow-clip-margin: .1em; }
.arr-line > span { display: block; }
.arrive .arr-line > span { animation: arr-rise var(--t-page) var(--ease-out) both; animation-delay: calc(120ms + var(--i) * var(--stagger-line)); }
.arrive .arr-pic { animation: arr-wipe var(--t-page) var(--ease-out) both; }
.arrive .arr-pic > * { animation: arr-settle 1100ms var(--ease-out) both; }
.arrive .arr-late { animation: arr-fade var(--t-slow) var(--ease-out) both; animation-delay: 520ms; }
@keyframes arr-rise { from { translate: 0 105%; } }
@keyframes arr-wipe { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0); } }
@keyframes arr-settle { from { scale: 1.1; } }
@keyframes arr-fade { from { opacity: 0; translate: 0 .5rem; } }
@media (prefers-reduced-motion: reduce) {
  .arrive .arr-line > span, .arrive .arr-pic, .arrive .arr-pic > *, .arrive .arr-late { animation: arr-none 1ms both; }
  @keyframes arr-none { from { opacity: .99; } }
}
/* argus:copy-end css */
</style>
</head>
<body>
<header class="top"><strong>Maison Lumen</strong><span>Lighting, made in Copenhagen</span></header>
<main>
  <!-- argus:copy-start html -->
  <section class="hero">
    <div>
      <h1>
        <span class="arr-line"><span style="--i:0">Light that</span></span>
        <span class="arr-line"><span style="--i:1">falls where</span></span>
        <span class="arr-line"><span style="--i:2">you read.</span></span>
      </h1>
      <div class="meta arr-late"><span>The Nook reading lamp, brass and linen</span><a href="?shop">Shop the Nook, €420</a></div>
    </div>
    <figure class="arr-pic">
      <svg viewBox="0 0 500 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A brass reading lamp over an armchair">
        <rect width="500" height="800" fill="#3a3530"/>
        <path d="M120 120 L380 120 L330 260 L170 260 Z" fill="#e8d8b8"/>
        <path d="M170 260 L330 260 L470 800 L30 800 Z" fill="#f2c879" opacity=".25"/>
        <rect x="246" y="260" width="8" height="420" fill="#b8924f"/>
        <rect x="90" y="560" width="320" height="200" rx="30" fill="#6e5a48"/>
        <rect x="190" y="680" width="120" height="16" fill="#b8924f"/>
      </svg>
    </figure>
  </section>
  <!-- argus:copy-end html -->
</main>
</body>
</html>
