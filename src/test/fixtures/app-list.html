<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture app list</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 -apple-system, Helvetica, Arial, sans-serif; color: #1a1a1a; background: #f4f4f4; }
  main { padding: 16px 16px 0; }
  h1 { font-size: 28px; margin: 8px 0 16px; }
  .row { display: block; height: 64px; padding: 20px 12px; margin-bottom: 8px; background: #fff; color: #1a1a1a; text-decoration: none; border-radius: 10px; }
  .row:focus-visible { outline: 3px solid #1a5fd0; }
  .row:last-child { margin-bottom: 0; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: flex; background: #fff; border-top: 1px solid #ddd; }
  .tabbar a { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #333; text-decoration: none; }
  .tabbar a:focus-visible { outline: 3px solid #1a5fd0; outline-offset: -3px; }
</style>
</head>
<body>
<main>
  <h1>Menu</h1>
  <div>
    <a class="row" href="#item-1">Espresso</a>
    <a class="row" href="#item-2">Flat white</a>
    <a class="row" href="#item-3">Cappuccino</a>
    <a class="row" href="#item-4">Latte</a>
    <a class="row" href="#item-5">Mocha</a>
    <a class="row" href="#item-6">Cortado</a>
    <a class="row" href="#item-7">Macchiato</a>
    <a class="row" href="#item-8">Americano</a>
    <a class="row" href="#item-9">Long black</a>
    <a class="row" href="#item-10">Ristretto</a>
    <a class="row" href="#item-11">Affogato</a>
    <a class="row" href="#item-12">Chai latte</a>
    <a class="row" href="#item-13">Hot chocolate</a>
    <a class="row" href="#item-14">Last row, always under the tab bar</a>
  </div>
</main>
<nav class="tabbar" aria-label="Tabs">
  <a href="#home">Home</a><a href="#menu">Menu</a><a href="#account">Account</a>
</nav>
</body>
</html>
