<!doctype html>
<!--
  micro-stepper: a quantity stepper whose number rolls like a slot: up when you add,
  down when you take away, and the minus button rests disabled at the minimum.
  Mechanism: WAAPI on two stacked spans (old out, new in), 220ms ease-out; a quick
  second press drops the half-finished roll and starts the next from where it is.
  It is a real <input type="number"> underneath for forms and screen readers (the
  rolling digits are aria-hidden), and the change is announced by the input itself.
  Keyboard: the buttons, or ArrowUp/ArrowDown in the field. Reduced motion: no roll.
  Copy the blocks marked for copying (CSS, HTML and script).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slot-rolling quantity stepper (micro-stepper)</title>
<style>
/* Demo page */
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3eee8; color: #201a15; font: 400 16px/1.5 "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
.line { width: min(30rem, 92vw); display: grid; grid-template-columns: 4.5rem 1fr auto; gap: 1.25rem; align-items: center; background: #fff; padding: 1.25rem; border-radius: 10px; }
.thumb { aspect-ratio: 1; border-radius: 6px; background: #c9a27a; }
.line h1 { font: 600 1rem/1.3 "Avenir Next", sans-serif; margin: 0; }
.line p { margin: 0; color: #6e6257; font-size: 15px; }

/* argus:copy-start css */
:root { --ease-out: cubic-bezier(.22,1,.36,1); }
.step { display: inline-flex; align-items: center; border: 1px solid #201a1533; border-radius: 99px; }
.step button { all: unset; width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; border-radius: 99px; font: 500 20px/1 "Avenir Next", sans-serif; }
.step button:focus-visible { outline: 2px solid #b4532a; outline-offset: -2px; }
.step button:disabled { opacity: .3; cursor: default; }
.step .val { position: relative; width: 2.2ch; height: 1.4em; display: grid; overflow: clip; font: 600 18px/1.4 "Avenir Next", sans-serif; font-variant-numeric: tabular-nums; text-align: center; }
.step .val span { grid-area: 1 / 1; }
.step input { position: absolute; inset: 0; opacity: 0; width: 100%; font-size: 18px; text-align: center; border: 0; }
.step input:focus-visible + .digits { outline: 2px solid #b4532a; outline-offset: 2px; border-radius: 3px; }
.step .digits { display: grid; }
.step .digits span { grid-area: 1 / 1; }
@media (prefers-reduced-motion: reduce) { .step .digits span { animation: none; } } /* the roll is WAAPI; the script also skips it */
/* argus:copy-end css */
</style>
</head>
<body>
<main class="line">
  <div class="thumb" role="img" aria-label="Linen tea towel in oat"></div>
  <div><h1>Linen tea towel, oat</h1><p>£14 each</p></div>
  <!-- argus:copy-start html -->
  <div class="step" data-step>
    <button type="button" data-d="-1" aria-label="One fewer">−</button>
    <label class="val"><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Quantity</span><input type="number" min="1" max="20" value="1" inputmode="numeric"><span class="digits" aria-hidden="true"><span>1</span></span></label>
    <button type="button" data-d="1" aria-label="One more">+</button>
  </div>
  <!-- argus:copy-end html -->
</main>
<script>
// argus:copy-start js
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  document.querySelectorAll('[data-step]').forEach(step => {
    const input = step.querySelector('input'), digits = step.querySelector('.digits');
    const minus = step.querySelector('[data-d="-1"]'), plus = step.querySelector('[data-d="1"]');
    const min = +input.min, max = +input.max;
    let shown = +input.value;
    const render = () => {
      const v = Math.max(min, Math.min(max, +input.value || min));
      input.value = v;
      minus.disabled = v <= min; plus.disabled = v >= max;
      if (v === shown) return;
      const dir = v > shown ? 1 : -1; shown = v;
      while (digits.children.length > 1) digits.firstElementChild.remove();
      const old = digits.firstElementChild, next = document.createElement('span');
      next.textContent = v; digits.append(next);
      if (reduce.matches) { old.remove(); return; }
      const o = { duration: 220, easing: 'cubic-bezier(.22,1,.36,1)' };
      old.animate([{ translate: '0 0', opacity: 1 }, { translate: `0 ${-dir * 100}%`, opacity: 0 }], { ...o, fill: 'forwards' });
      next.animate([{ translate: `0 ${dir * 100}%` }, { translate: '0 0' }], o).finished.then(() => old.remove(), () => {});
    };
    step.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { input.value = +input.value + +b.dataset.d; render(); }));
    input.addEventListener('input', render);
    render();
  });
})();
// argus:copy-end js
if (location.search.includes('demo')) { const p = document.querySelector('[data-d="1"]'); setTimeout(() => p.click(), 250); setTimeout(() => p.click(), 420); }
</script>
</body>
</html>
